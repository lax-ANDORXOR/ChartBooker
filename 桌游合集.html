    <!-- 游戏8: 开心消消乐 -->
    <script>
        (function() {
            const ROWS = 8,
                COLS = 8;
            let grid = [];
            let selected = null;
            let score = 0;

            const EMOJIS = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍉', '🍑', '🍒'];

            function initMatch() {
                grid = [];
                for (let r = 0; r < ROWS; r++) {
                    grid[r] = [];
                    for (let c = 0; c < COLS; c++) {
                        grid[r][c] = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
                    }
                }
                // 避免初始三连
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        while (true) {
                            const emoji = grid[r][c];
                            let dup = false;
                            if (r >= 2 && grid[r - 1][c] === emoji && grid[r - 2][c] === emoji) dup = true;
                            if (c >= 2 && grid[r][c - 1] === emoji && grid[r][c - 2] === emoji) dup = true;
                            if (dup) {
                                grid[r][c] = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
                            } else break;
                        }
                    }
                }
                selected = null;
                score = 0;
                renderMatch();
                document.getElementById('match-score').textContent = `得分: ${score}`;
            }

            function renderMatch() {
                const container = document.getElementById('match-grid');
                container.innerHTML = '';
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'match-cell';
                        if (selected && selected[0] === r && selected[1] === c) cell.classList.add('selected');
                        cell.textContent = grid[r][c];
                        cell.dataset.row = r;
                        cell.dataset.col = c;
                        cell.addEventListener('click', () => handleMatchClick(r, c));
                        container.appendChild(cell);
                    }
                }
            }

            function handleMatchClick(r, c) {
                if (!selected) {
                    selected = [r, c];
                    renderMatch();
                    return;
                }
                // 尝试交换
                const sr = selected[0],
                    sc = selected[1];
                if (sr === r && sc === c) { selected = null;
                    renderMatch(); return; }
                // 检查相邻
                if (Math.abs(sr - r) + Math.abs(sc - c) !== 1) {
                    selected = [r, c];
                    renderMatch();
                    return;
                }
                // 交换
                const temp = grid[sr][sc];
                grid[sr][sc] = grid[r][c];
                grid[r][c] = temp;
                // 检查消除
                const removed = checkMatch();
                if (removed.length > 0) {
                    // 消除并掉落
                    removeAndDrop(removed);
                    score += removed.length * 2;
                    document.getElementById('match-score').textContent = `得分: ${score}`;
                    selected = null;
                    renderMatch();
                    // 继续检查连锁
                    setTimeout(() => {
                        let more = true;
                        while (more) {
                            const rem = checkMatch();
                            if (rem.length > 0) {
                                removeAndDrop(rem);
                                score += rem.length * 2;
                                document.getElementById('match-score').textContent = `得分: ${score}`;
                                renderMatch();
                            } else more = false;
                        }
                    }, 200);
                } else {
                    // 换回来
                    const tempBack = grid[sr][sc];
                    grid[sr][sc] = grid[r][c];
                    grid[r][c] = tempBack;
                    selected = null;
                    renderMatch();
                }
            }

            function checkMatch() {
                let toRemove = new Set();
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const emoji = grid[r][c];
                        if (!emoji) continue;
                        // 水平
                        let count = 1;
                        let left = c - 1;
                        while (left >= 0 && grid[r][left] === emoji) { count++;
                            left--; }
                        let right = c + 1;
                        while (right < COLS && grid[r][right] === emoji) { count++;
                            right++; }
                        if (count >= 3) {
                            for (let i = left + 1; i < right; i++) toRemove.add(r + ',' + i);
                        }
                        // 垂直
                        count = 1;
                        let up = r - 1;
                        while (up >= 0 && grid[up][c] === emoji) { count++;
                            up--; }
                        let down = r + 1;
                        while (down < ROWS && grid[down][c] === emoji) { count++;
                            down++; }
                        if (count >= 3) {
                            for (let i = up + 1; i < down; i++) toRemove.add(i + ',' + c);
                        }
                    }
                }
                return Array.from(toRemove).map(s => s.split(',').map(Number));
            }

            function removeAndDrop(removed) {
                // 从下往上移除并掉落
                const cols = {};
                removed.forEach(([r, c]) => {
                    grid[r][c] = null;
                    if (!cols[c]) cols[c] = [];
                    cols[c].push(r);
                });
                // 每列掉落
                for (let c in cols) {
                    const col = parseInt(c);
                    const rows = cols[c].sort((a, b) => a - b);
                    // 从下往上填充
                    for (let r = ROWS - 1; r >= 0; r--) {
                        if (grid[r][col] === null) {
                            // 找到上面第一个非空
                            for (let k = r - 1; k >= 0; k--) {
                                if (grid[k][col] !== null) {
                                    grid[r][col] = grid[k][col];
                                    grid[k][col] = null;
                                    break;
                                }
                            }
                            if (grid[r][col] === null) {
                                // 生成新图标
                                grid[r][col] = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
                            }
                        }
                    }
                }
            }

            document.getElementById('match-reset-btn').addEventListener('click', initMatch);
            window.initMatch = initMatch;
            initMatch();
        })();
    </script>
